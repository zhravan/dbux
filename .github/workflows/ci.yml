name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  platform-bundles:
    name: Installer build (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
          - target: macos-arm64
            os: macos-latest
            bundles: dmg
          - target: macos-x64
            os: macos-15-intel
            bundles: dmg
          - target: windows-x64
            os: windows-latest
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf rpm
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress
      - name: Validate shell installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: npm install --no-audit --no-fund
      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon-source.png --output src-tauri/icons
      - name: Build native installer
        run: npm run tauri build -- --bundles "${{ matrix.bundles }}"
      - name: Upload Linux installers
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS installer
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.target }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installers
        if: matrix.target == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust format, lint, and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - run: cargo test --all
        working-directory: src-tauri

  desktop-e2e:
    name: Desktop UI + PostgreSQL end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbux_test
          POSTGRES_PASSWORD: dbux_test
          POSTGRES_DB: dbux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbux_test -d dbux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DBUX_TEST_DB_HOST: 127.0.0.1
      DBUX_TEST_DB_PORT: 5432
      DBUX_TEST_DB_NAME: dbux_test
      DBUX_TEST_DB_USER: dbux_test
      DBUX_TEST_DB_PASSWORD: dbux_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            xvfb \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - run: npm install --no-audit --no-fund
      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon-source.png --output src-tauri/icons
      - name: Build desktop application
        run: npm run tauri build -- --no-bundle
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Run real UI integration test
        run: xvfb-run -a npm run test:e2e
      - name: Upload desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbux-pr-ui-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
