name: Release desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (for example dbux-v0.2.0); leave blank to do nothing
        required: false
        type: string

# Default to read-only. Grant write access only to jobs that need it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Determine SemVer release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Open or update release PR and prepare draft release
        id: release
        if: github.event_name == 'push'
        uses: release-please-oss/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          bootstrap-sha: a596efde79e3781a4098f01f0584041ba0dbd93c

  validate-version:
    name: Validate SemVer and synchronized app versions
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate SemVer tag and synchronized app versions
        id: validate
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          node scripts/validate-release-version.mjs "$RELEASE_TAG"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} installer
    needs: validate-version
    if: needs.validate-version.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            platform: Linux x64
            os: ubuntu-24.04
          - target: macos-arm64
            platform: macOS Apple Silicon
            os: macos-latest
          - target: macos-x64
            platform: macOS Intel
            os: macos-15-intel
          - target: windows-x64
            platform: Windows x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress
      - run: npm install --no-audit --no-fund
      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon-source.png --output src-tauri/icons
      - name: Build installer bundles
        run: npm run tauri build
      - name: Upload Linux installers
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.target }}-${{ needs.validate-version.outputs.tag_name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS installer
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.target }}-${{ needs.validate-version.outputs.tag_name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows installers
        if: matrix.target == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.target }}-${{ needs.validate-version.outputs.tag_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and preserve latest designation
    needs: [validate-version, build]
    if: needs.validate-version.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dbux-installers-*-${{ needs.validate-version.outputs.tag_name }}
          path: release-assets
          merge-multiple: true
      - name: Verify every platform produced installer assets
        run: |
          set -euo pipefail
          find release-assets -type f -print | sort
          test -n "$(find release-assets -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -type f -name '*.rpm' -print -quit)"
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -type f -name '*.msi' -print -quit)"
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)"
      - name: Attach installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No installer assets were downloaded." >&2
            exit 1
          fi

          # Release Please currently names this single component's tags dbux-vX.Y.Z.
          # Also accept vX.Y.Z for manually created legacy tags.
          if [[ "$RELEASE_TAG" == dbux-v* ]]; then
            RELEASE_VERSION="${RELEASE_TAG#dbux-v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then
            RELEASE_VERSION="${RELEASE_TAG#v}"
          else
            echo "Unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$RELEASE_VERSION" == *-* ]]; then
            RELEASE_KIND="prerelease"
          else
            RELEASE_KIND="stable"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ "$RELEASE_KIND" == "prerelease" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease
            else
              # Do not force an older retried version to become Latest.
              # GitHub's default stable-release selection remains in effect.
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            if [[ "$RELEASE_KIND" == "prerelease" ]]; then
              gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --prerelease
            else
              # Leave Latest selection to GitHub's stable-release version rules.
              gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
            fi
          fi
