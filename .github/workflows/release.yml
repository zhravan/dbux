name: Release desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            asset_pattern: "src-tauri/target/release/bundle/**/*.{deb,AppImage}"
          - platform: macOS
            os: macos-14
            asset_pattern: "src-tauri/target/release/bundle/**/*.dmg"
          - platform: Windows
            os: windows-2022
            asset_pattern: "src-tauri/target/release/bundle/**/*.{msi,exe}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress
      - run: npm install --no-audit --no-fund
      - name: Build installer bundles
        run: npm run tauri build
      - name: Upload native installers
        uses: actions/upload-artifact@v4
        with:
          name: dbux-installers-${{ matrix.platform }}-${{ github.event.inputs.tag || github.ref_name }}
          path: ${{ matrix.asset_pattern }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dbux-installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify installer assets exist
        run: |
          find release-assets -type f -print
          test -n "$(find release-assets -type f -print -quit)"
      - name: Create GitHub release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "DBUX $RELEASE_TAG" \
            --generate-notes
