[package]
name = "dbux"
version = "0.2.0"
description = "A focused database workbench for developers"
authors = ["DBUX contributors"]
edition = "2021"

[lib]
name = "dbux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
bigdecimal = "0.4"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }