[package]
name = "dbux"
version = "0.1.0"
description = "A focused database workbench for developers"
authors = ["DBUX contributors"]
edition = "2021"

[lib]
name = "dbux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"